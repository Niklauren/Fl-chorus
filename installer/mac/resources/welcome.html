<p>Three-voice chorus modelled on FL Studio's Fruity Chorus.</p>
<p>Installs:</p>
<ul>
<li>VST3 &rarr; /Library/Audio/Plug-Ins/VST3</li>
<li>Audio Unit &rarr; /Library/Audio/Plug-Ins/Components</li>
</ul>
<p>After installing, rescan plug-ins in your DAW.</p>
